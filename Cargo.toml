[package]
name = "ot2-speedrun-assistant"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Route orchestration and field encounter prediction using the standalone OT2 battle engine"
publish = false
default-run = "ot2-gui"

[dependencies]
ot2-battle-engine = { path = "../OT2BattleEngineRust" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[profile.release]
lto = "thin"
codegen-units = 1

[[bin]]
name = "ot2-gui"
path = "src/bin/ot2-gui.rs"
